<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Mahadev | WhatsApp Support</title>
  <meta name="description" content="Continue your conversation with Mahadev on WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{box-sizing:border-box}
    :root{--green:#25d366;--green-dark:#075e54;--text:#111b21;--muted:#667781}
    html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--text);background:#fff}
    body{min-height:100vh;display:flex;flex-direction:column}
    .topbar{height:88px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4.5vw,76px);border-bottom:1px solid #f0f2f3;background:#fff}
    .wordmark{display:flex;align-items:center;gap:9px;color:#20c96b;text-decoration:none;font-size:22px;font-weight:750;letter-spacing:-.8px;white-space:nowrap}
    .wordmark i{font-size:36px}
    .nav{display:flex;align-items:center;justify-content:center;gap:clamp(18px,3.1vw,54px);margin:0 22px}
    .nav a{color:#101820;text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap}
    .nav a:hover{color:#079b51}
    .nav .external{font-size:11px;margin-left:7px}
    .actions{display:flex;align-items:center;gap:12px}
    .pill{height:48px;min-width:112px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:14px;border:1px solid #15221c;border-radius:30px;color:#111b21;background:#fff;text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap}
    .pill.green{min-width:145px;background:var(--green);border-color:#17241d}
    .pill:hover{filter:brightness(.97)}
    .main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:84px 20px 55px}
    .profile{width:min(100%,690px);display:flex;flex-direction:column;align-items:center;text-align:center}
    .avatar{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:#080b09;border:1px solid #e4e8e5;box-shadow:0 2px 7px rgba(0,0,0,.08);color:#e5c96a;position:relative;overflow:hidden}
    .avatar:before{content:"";position:absolute;inset:8px;border:1px solid rgba(229,201,106,.65);border-radius:50%}
    .avatar .trident{font-size:49px;line-height:1;color:#e6c96a;text-shadow:0 2px 12px rgba(229,201,106,.3)}
    .avatar .om{position:absolute;bottom:17px;font-size:10px;letter-spacing:2px;font-weight:800;color:#f5e6ac}
    h1{margin:42px 0 39px;font-size:27px;line-height:1.2;font-weight:500;letter-spacing:-.5px}
    .message{width:min(100%,690px);min-height:78px;padding:18px 26px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:#f7f5f4;color:#54616a;font-size:17px;line-height:1.55;overflow-wrap:anywhere}
    .message .greeting{font-weight:500}
    .buttons{width:min(100%,322px);display:flex;flex-direction:column;gap:14px;margin-top:40px}
    .open,.continue{width:100%;height:62px;display:flex;align-items:center;justify-content:center;border-radius:34px;text-decoration:none;font-size:17px;font-weight:500;transition:background .15s,transform .15s}
    .open{background:var(--green);border:1px solid #14231b;color:#071b10}
    .continue{background:#fff;border:1px solid #15221c;color:#111b21}
    .open:hover,.continue:hover{transform:translateY(-1px)}
    .download-note{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:40px;color:#111b21;font-size:16px;flex-wrap:wrap}
    .download-note .wa-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:#00c853;color:white;font-size:21px}
    .download-note a{color:#111b21;text-decoration:none;border-bottom:2px solid var(--green);padding-bottom:2px}
    .download-note a:hover{color:#079b51}
    @media(max-width:1000px){.nav{gap:17px}.nav a{font-size:13px}.topbar{padding:0 22px}.wordmark{font-size:20px}.actions .pill{min-width:auto;padding:0 16px}}
    @media(max-width:760px){.topbar{height:70px}.nav{display:none}.wordmark i{font-size:31px}.actions .login{display:none}.actions .pill.green{height:43px;min-width:112px;font-size:14px}.main{padding:62px 18px 45px}.avatar{width:104px;height:104px}.avatar .trident{font-size:44px}h1{margin:34px 0 32px;font-size:25px}.message{min-height:72px;font-size:15px;padding:16px}.buttons{margin-top:34px}.open,.continue{height:57px;font-size:16px}.download-note{margin-top:34px;font-size:14px}}
    @media(max-width:360px){.actions .pill.green{padding:0 12px;min-width:100px}.main{padding-top:45px}.message{font-size:14px}}
  </style>
  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)n=f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1085869497595179');
    fbq('track','PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1085869497595179&ev=PageView&noscript=1"></noscript>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="https://www.whatsapp.com/features/">Features <i class="fa-solid fa-chevron-down external"></i></a>
      <a href="https://www.whatsapp.com/privacy/">Privacy</a>
      <a href="https://blog.whatsapp.com/">Blog</a>
      <a href="https://www.whatsapp.com/download/">Apps</a>
      <a href="https://faq.whatsapp.com/">Help Center <i class="fa-solid fa-arrow-up-right-from-square external"></i></a>
      <a href="https://business.whatsapp.com/">For Business <i class="fa-solid fa-arrow-up-right-from-square external"></i></a>
    </nav>
    <div class="actions">
      <a class="pill login" href="https://web.whatsapp.com/">Log In <i class="fa-solid fa-chevron-right"></i></a>
      <a class="pill green" href="https://www.whatsapp.com/download/">Download <i class="fa-solid fa-download"></i></a>
    </div>
  </header>
  <main class="main">
    <section class="profile" aria-labelledby="profile-name">
      <div class="avatar" aria-hidden="true"><span class="trident">♆</span><span class="om">ॐ MAHADEV</span></div>
      <h1 id="profile-name">Mahadev</h1>
      <div class="message"><span class="greeting">Hi Mahadev! 👋 Welcome. How can we help you today?</span></div>
      <div class="buttons">
        <a class="open" id="whatsappButton" href="https://walinkgo.com/MahadevSupportTeam" target="_blank" rel="noopener noreferrer">Open app</a>
        <a class="continue" href="https://walinkgo.com/MahadevSupportTeam" target="_blank" rel="noopener noreferrer">Continue to WhatsApp Web</a>
      </div>
      <div class="download-note"><span class="wa-icon"><i class="fa-brands fa-whatsapp"></i></span><span>Don't have the app?</span><a href="https://www.whatsapp.com/download/">Download it now</a></div>
    </section>
  </main>
  <script>
    document.querySelectorAll('#whatsappButton,.continue').forEach(function(link){
      link.addEventListener('click',function(){if(typeof fbq==='function')fbq('track','Contact');});
    });
  </script>
</body>
</html>
